# Conda environment for Atomistic Language Models: Python 3.10, CUDA-12 torch, and
# the project's pip dependencies.
#
#   conda env create -f environment.yml      # or: mamba / micromamba
#   conda activate alm
#   bash external/setup_mattergen.sh          # fetch + patch the MatterGen fork
#   cd external/mattergen && bash install_for_h200.sh && bash build_pyg_for_torch29.sh
#
# CUDA 12 only. The torch wheel comes from the cu128 index below. Do not install
# CUDA-13-tagged nvidia-* wheels into this env; they collide on shared .so paths
# and break torch.
name: alm
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.0+cu128
      # Project + its dependencies (mirrors pyproject.toml; torch stays pinned above):
      - -e .
